name: P0 Babylon Build Gate

on:
  push:
    branches:
      - p0-babylon-migration
    paths:
      - 'src/**'
      - 'server/**'
      - 'cloudflare/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'playwright.hf27.config.ts'
      - '.github/workflows/p0-babylon-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-babylon-migration
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Babylon source integrity
        run: npm run verify:p0:babylon
      - name: Current project verification
        run: npm run verify:current
      - name: Unit tests
        run: npm test

  visual-capture:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-babylon-migration
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture fixed Babylon visual cameras
        run: npm run visual:capture
      - name: Evaluate captures against reference style metrics
        run: npm run visual:evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-babylon-visual-captures
          path: artifacts/hf27-*
          if-no-files-found: warn
          retention-days: 14
